name: Languages

# Every change to a language: the packs are checked and, on main, index.json and the README table are rebuilt.
# IsaClient reads index.json to list the languages (with how much each one translates) and to verify downloads.

on:
  push:
    branches: [main]
    paths: ["packs/**", "source/**", "tools/**", ".github/workflows/index.yml"]
  pull_request:
    paths: ["packs/**", "source/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: languages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the packs
        if: github.event_name == 'pull_request'
        run: python tools/build_index.py --check

      - name: Rebuild index.json and the README table
        if: github.event_name != 'pull_request'
        run: |
          python tools/build_index.py
          if [ -n "$(git status --porcelain index.json README.md)" ]; then
            git config user.name "isa-l10n bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json README.md
            git commit -m "Update index.json"
            git push
          else
            echo "index.json is up to date"
          fi
